<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — BiliFollow</title>
  <meta name="description" content="Login to your BiliFollow account.">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .auth-page {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 35px;
      border-radius: 20px;
      border: 1px solid #e5eaf0;
      box-shadow: 0 10px 35px rgba(0,0,0,0.06);
    }

    .auth-box h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8dee7;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #00aeec;
    }

    .auth-button {
      width: 100%;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-top: 5px;
    }

    .auth-message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .auth-footer {
      margin-top: 22px;
      text-align: center;
      color: #6b7280;
    }

    .auth-footer a {
      color: #00aeec;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo">
    Bili<span>Follow</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a class="nav-button" href="register.html">Create Account</a>
  </nav>
</header>


<main class="auth-page">

  <div class="auth-box">

    <h1>Welcome Back 👋</h1>

    <p class="auth-subtitle">
      Login to your BiliFollow account
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>


      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>


      <button
        type="submit"
        class="primary-button auth-button"
      >
        Login
      </button>

    </form>

    <div id="loginMessage" class="auth-message"></div>


    <div class="auth-footer">
      <a href="reset-password.html">Forgot password?</a><br><br>
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

</main>


<footer>

  <div class="logo">
    Bili<span>Follow</span>
  </div>

  <p>
    © 2026 BiliFollow. All rights reserved.
  </p>

  <p class="small">
    BiliFollow Coins are internal platform points and
    are not Bilibili official Coins or Flowers.
  </p>

</footer>
  
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
  
</body>
</html>
