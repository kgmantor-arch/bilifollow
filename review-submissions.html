<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Submissions - BiliFollow</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .review-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .submission-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .submission-card h3 {
      margin-top: 0;
    }

    .proof-link {
      display: inline-block;
      margin: 10px 0;
      word-break: break-all;
    }

    .btn {
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
      font-weight: 600;
    }

    .approve-btn {
      background: #16a34a;
      color: white;
    }

    .reject-btn {
      background: #dc2626;
      color: white;
    }

    .note-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .status {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: #fff;
      border-radius: 14px;
    }
  </style>
</head>

<body>

  <main class="review-container">

    <h1>📋 Review Submissions</h1>

    <p>
      All proof submissions for every task you created appear here. Pending proofs are listed first.
    </p>

    <div id="message"></div>

    <div id="submissionsList">
      Loading submissions...
    </div>

    <p>
      <a href="my-tasks.html">← Back to My Tasks</a>
    </p>

  </main>

  <script src="js/config.js"></script>
  <script src="js/review-submissions.js"></script>

</body>
</html>
